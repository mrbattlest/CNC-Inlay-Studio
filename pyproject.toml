[project]
name = "cnc-inlay"
version = "1.1.29"
description = "Generate paired pocket/plug G-code files for CNC wood inlays from SVG or PNG silhouettes."
authors = [
    { name = "Malcolm Ross", email = "ross.malcolm@gmail.com" }
]
requires-python = ">=3.13,<3.14"
dependencies = [
    "PySide6>=6.8",
    "numpy>=2.0",
    "scipy>=1.14",
    "scikit-image>=0.24",
    "shapely>=2.0",
    "svgelements>=1.9",
    "Pillow>=10.4",
    "pyclipper>=1.3",
    "pyqtgraph>=0.13",
    "PyOpenGL>=3.1",
    "pyserial>=3.5",
    "google-genai>=0.8",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyinstaller>=6.10",
]

[project.scripts]
cnc-inlay = "cnc_inlay.app:main"

[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
